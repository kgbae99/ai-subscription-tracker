<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>잠금 해제</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #eef4ff, #f4f7fb);
      color: #111827;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    h1 { margin-top: 0; }
    p { color: #6b7280; }
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .flash {
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 12px;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔐 잠금 해제</h1>
    <p>PIN을 입력해야 앱에 접근할 수 있습니다.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post">
      <label>PIN</label>
      <input type="password" name="pin" placeholder="PIN 입력" autofocus />
      <button type="submit">잠금 해제</button>
    </form>
  </div>
</body>
</html>
